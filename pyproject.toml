[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logparseiqx"
version = "0.1.0"
description = "Local log parser powered by Ollama - Like Opus 4.5 Thinking Mode™ but $0"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "Millpond AI", email = "mike@millpond.ai" }
]
keywords = [
    "log-parser",
    "ollama",
    "llm",
    "cloudflare",
    "cli",
    "devtools",
    "ai",
    "local-llm"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Logging",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.0.0",
    "requests>=2.25.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://millpond.ai"
Repository = "https://github.com/semanticintent/logparseiqx"
Documentation = "https://github.com/semanticintent/logparseiqx#readme"
Issues = "https://github.com/semanticintent/logparseiqx/issues"

[project.scripts]
logparseiqx = "logparseiqx.cli:cli"
lpx = "logparseiqx.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/logparseiqx"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
